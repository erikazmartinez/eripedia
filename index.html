<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf8f2">
  <title>Eripedia · Study Garden</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="course-sidebar" aria-label="Course list">
      <div class="sidebar-head"><span>MY COURSES</span><button id="sidebar-close" type="button" aria-label="Close course list">×</button></div>
      <nav id="main-nav" class="course-nav" aria-label="Courses"></nav>
      <button id="add-course" class="add-course" type="button">＋ <span>ADD A COURSE</span></button>
    </aside>
    <div class="main-area">
      <header class="topbar"><div class="topbar-row"><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="course-sidebar" aria-expanded="true" aria-label="Show course list"><span>☰</span></button><button class="brand" data-go="dashboard" aria-label="Eripedia dashboard"><span class="brand-flower" aria-hidden="true">✿</span><span class="brand-text"><strong>eripedia</strong><small>your study garden</small></span></button><div class="top-actions"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode"><span class="theme-symbol">☾</span><span class="theme-label">Dark mode</span></button></div></div><nav id="primary-nav" class="primary-nav" aria-label="Study sections"></nav></header>
      <main id="main-content"></main>
    </div>
  </div>
  <dialog id="course-dialog" class="modal"><form method="dialog" id="course-form"><button class="modal-close" value="cancel" formnovalidate aria-label="Close">×</button><div class="modal-flower" aria-hidden="true">✿</div><h2>Add a course</h2><p>Give your next subject a place in Eripedia. Its materials and lessons can be added later.</p><label for="course-name">Course name</label><input id="course-name" name="course-name" maxlength="60" placeholder="e.g. Data Structures" required><div class="modal-actions"><button value="cancel" formnovalidate class="button ghost">Cancel</button><button value="save" class="button solid">Add course</button></div></form></dialog>
  <script src="data.js"></script>
  <script src="curriculum.js"></script>
  <script src="exams.js"></script>
  <script src="site.js"></script>
</body>
</html>
